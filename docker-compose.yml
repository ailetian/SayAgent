# SayAgent 本地中间件：MySQL(业务库) / Redis(缓存) / pgvector(向量库)
# 大白话：一条命令拉起三个"仓库"，应用通过 application.yml 连它们。
# 启动：docker compose up -d   查看：docker compose ps（三容器均 healthy 即过关）

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sayagent
      MYSQL_USER: sayagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sayagent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # §8 Redis AOF 持久化
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sayagent_vector
      POSTGRES_USER: sayagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sayagent}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d   # 首次启动自动启用 vector 扩展（见 T6）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayagent"]
      interval: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  pg-data:

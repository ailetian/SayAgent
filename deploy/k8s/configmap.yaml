# Hify K8s 非敏感配置（§7.11：只放非秘钥配置；密码/秘钥在 secret.yaml）
# 依据：AGENTS.md §5.1(组件清单) / §5.2(配置点) / §9(环境变量)
apiVersion: v1
kind: ConfigMap
metadata:
  name: hify-config
  labels:
    app.kubernetes.io/part-of: hify
data:
  # —— 后端非敏感运行参数（键名即 Spring 环境变量名，envFrom 直接注入）——
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_PORT: "9095"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/hify?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "hify"
  SPRING_DATASOURCE_PG_JDBC_URL: "jdbc:postgresql://pgvector:5432/hify_vector"
  SPRING_DATASOURCE_PG_USERNAME: "hify"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  # 前端正式域名（Ingress host）；如多域名用逗号（application.yml 的 hify.cors.allowed-origins）
  HIFY_CORS_ALLOWED_ORIGINS: "http://hify.local"
  HIFY_JWT_EXPIRATION_MS: "7200000"

  # —— 前端 nginx 配置（frontend Deployment 挂载到 /etc/nginx/conf.d/default.conf）——
  # 已预置 §5.2 SSE 友好设置（proxy_buffering off + 300s 超时），T5 会正式细化。
  FRONTEND_NGINX_CONF: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://sayagent-backend:9095;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
        }
    }

  # —— pgvector 首次启动启用 vector 扩展的初始化 SQL ——
  PGVECTOR_INITDB_SQL: |
    CREATE EXTENSION IF NOT EXISTS vector;

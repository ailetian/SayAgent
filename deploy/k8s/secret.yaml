# SayAgent K8s 秘钥（§7.11 / §9：秘钥不落代码）
# 依据：T4_部署...清单「secret.yaml 仅占位、真实值走 Secret/env」
#
# ⚠️⚠️⚠️ 以下全部是「占位符」(base64("CHANGE_ME_*"))，不是真实密码！
# 生产部署前必须覆盖，二选一：
#   A) 直接改这里为真实 base64（不推荐，易误提交）
#   B) 用命令创建，绝不进 git：
#        kubectl create secret generic sayagent-secrets \
#          --from-literal=mysql-password='<真实>' \
#          --from-literal=mysql-root-password='<真实>' \
#          --from-literal=postgres-password='<真实>' \
#          --from-literal=sayagent-jwt-secret='<至少32字节>' \
#          --from-literal=sayagent-admin-password='<真实>' \
#          --from-literal=llm-api-key='<真实LLM Key>'
# 提交前 grep 确保无真实明文（验收点 4）。
apiVersion: v1
kind: Secret
metadata:
  name: sayagent-secrets
  labels:
    app.kubernetes.io/part-of: sayagent
type: Opaque
data:
  mysql-password: Q0hBTkdFX01FX215c3Fs          # base64("CHANGE_ME_mysql")
  mysql-root-password: Q0hBTkdFX01FX3Jvb3Q=     # base64("CHANGE_ME_root")
  postgres-password: Q0hBTkdFX01FX3Bn            # base64("CHANGE_ME_pg")
  sayagent-jwt-secret: Q0hBTkdFX01FX2p3dF9hdF9sZWFzdF8zMl9ieXRlc19sb25nXyEh   # base64("CHANGE_ME_jwt_at_least_32_bytes_long_!!")
  sayagent-admin-password: Q0hBTkdFX01FX2FkbWlu       # base64("CHANGE_ME_admin")
  llm-api-key: Q0hBTkdFX01FX2xsbV9rZXk=          # base64("CHANGE_ME_llm_key")

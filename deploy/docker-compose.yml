# SayAgent 全栈一键起（本地 / 单机部署）
# 依据：T4_部署Dockerfile与docker_compose与K8s清单.md、AGENTS.md §3.1 / §5.1 / §5.2 / §7.11 / §9
#
# 与根目录 docker-compose.yml 的关系：
#   - 根 docker-compose.yml(M1/T2) 只起三个中间件，供「后端在本机 java -jar」开发联调用。
#   - 本文件是「全栈一键起」：backend(镜像) + 前端(镜像) + 三个中间件，一条命令拉起整套。
#   两者 project 名不同（目录名），卷名互不冲突，可分别使用。
#
# ⭐ 关键改进：backend 与 frontend 都改为「从源码在容器内多阶段构建」，
#   不再依赖本机先 `mvn package` / `npm run build`，也不再依赖被 .gitignore 忽略的
#   target/*.jar 与 frontend/dist。别人 git clone 下来直接 `docker compose up --build` 即可。
#
# 最简用法（仓库根目录）：
#   1) 准备环境变量：        cp deploy/.env.example deploy/.env   # 按需改密码 / JWT 秘钥
#   2) 一键构建并启动：      docker compose -f deploy/docker-compose.yml up -d --build
#   3) 校验后端健康：        curl http://localhost:9095/actuator/health
#   4) 访问：                浏览器开 http://localhost:8080  （前端 nginx 代理 /api → backend:9095）
#   （更省心：直接用仓库根的 ./start.sh 或 start.bat，会自动生成 .env + 轮询健康检查 + 打印地址）
#
# 秘钥纪律（§7.11 / §9）：所有密码 / JWT 秘钥 / 管理员密码 / LLM Key 一律用 ${ENV} 注入，
#   不写死明文；缺失时用与开发一致的弱默认值（仅本地演示，生产必须覆盖）。

# 路径纪律：compose 里的相对路径以【本文件所在目录 deploy/】为基准解析（无论从哪个目录执行 -f），
#   因此 build context 用 `..`（仓库根）：backend Dockerfile 的 COPY backend/...、frontend Dockerfile 的
#   COPY frontend/... 与 COPY deploy/nginx.conf 都以仓库根为基准。
#   ❌ 别写 `./deploy/nginx.conf`（会解析成 deploy/deploy/nginx.conf，静默挂载失败）。

name: sayagent

services:
  # ============ 后端（Spring Boot，镜像由 deploy/Dockerfile 多阶段构建）============
  backend:
    container_name: sayagent-backend
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sayagent-backend:latest
    # 端口仅在宿主机暴露用于本地验证；生产由 Ingress 进集群内部 Service
    ports:
      - "9095:9095"
    environment:
      # 显式锁端口，避免任何 ambient SERVER__PORT 劫持（见 M7 启动修复记要）
      SERVER_PORT: "9095"
      # —— 业务主库 MySQL（指向 compose 内服务名 mysql）——
      # 注：密码只注入 MYSQL_PASSWORD，由 application.yml 的 ${MYSQL_PASSWORD} 占位符消费，
      #     避免与 SPRING_DATASOURCE_PASSWORD 重复绑定同一属性。
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sayagent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: sayagent
      # —— 第二数据源 PostgreSQL 向量库（指向 pgvector）——
      SPRING_DATASOURCE_PG_JDBC_URL: "jdbc:postgresql://pgvector:5432/sayagent_vector"
      SPRING_DATASOURCE_PG_USERNAME: sayagent
      # —— Redis ——
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # —— 业务秘钥（§7.11：一律占位，生产用真实环境变量覆盖）——
      SAYAGENT_JWT_SECRET: ${SAYAGENT_JWT_SECRET:-dev-only-secret-key-please-change-in-prod-32bytes!!}
      SAYAGENT_ADMIN_PASSWORD: ${SAYAGENT_ADMIN_PASSWORD:-admin123}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sayagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sayagent}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    restart: unless-stopped

  # ============ 前端（Vue 构建产物由 frontend/Dockerfile 多阶段产出，nginx 托管）============
  frontend:
    container_name: sayagent-frontend
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: sayagent-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ============ 中间件：复用 M1/T2 定义（image / healthcheck 一致，保证与本地开发同构）============
  mysql:
    container_name: sayagent-mysql
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sayagent
      MYSQL_USER: sayagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sayagent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    container_name: sayagent-redis
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # §8 Redis AOF 持久化
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  pgvector:
    container_name: sayagent-pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sayagent_vector
      POSTGRES_USER: sayagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sayagent}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d   # 首次启动自动启用 vector 扩展（复用 M1/T2）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayagent"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  pg-data:

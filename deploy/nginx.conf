# Hify 前端 nginx 配置（docker-compose frontend 服务用）
# 依据：AGENTS.md §5.2（SSE 缓冲/超时）+ T4 全栈 docker-compose「前端静态(nginx)」
#
# 职责：
#   1) 托管 Vue 构建产物（/usr/share/nginx/html）
#   2) SPA history 回退（刷新子路由不 404）
#   3) 把 /api/* 反向代理到后端容器 backend:9095
#   4) 按 §5.2 关闭代理缓冲、放长超时，保证 SSE 流式不中断
#
# 注意：T5(部署配置) 会正式拥有并细化本文件（SSE 300s / 优雅停机 / 探针相关的 nginx 调优），
#       此处已预置 §5.2 的 SSE 友好设置，避免全栈一键起时 SSE 被缓冲/超时截断。

server {
    listen 80;
    server_name _;

    # —— 前端静态资源 ——
    root /usr/share/nginx/html;
    index index.html;

    # SPA：未匹配到静态文件时回退到 index.html（前端路由用 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— 后端 API 反代（SSE 友好）——
    location /api/ {
        proxy_pass http://backend:9095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # §5.2：关闭缓冲 + 放长超时，保证 /api/chat/stream 连续生成长文本不被截断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 关掉 nginx 对响应的分块缓冲，SSE 逐 token 直出
        chunked_transfer_encoding on;
    }
}
